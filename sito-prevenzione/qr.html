<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generatore QR code</title>
  <style>
    /* Stile semplice e chiaro: questa pagina la usano gli organizzatori, non i ragazzi */
    :root { --verde: #1f9d0f; --scuro: #0c1a10; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: #eef6ee;
      color: var(--scuro);
    }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { margin: 0 0 6px; font-size: 1.8rem; }
    p.intro { margin: 0 0 20px; color: #3d5a40; line-height: 1.5; }
    .scheda {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    label { font-weight: 700; display: block; margin-bottom: 6px; }
    input, select {
      width: 100%;
      font-size: 1rem;
      padding: 12px;
      border: 2px solid #b9d6b9;
      border-radius: 10px;
      font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: var(--verde); }
    .suggerimento { font-size: .85rem; color: #5b7a5e; margin-top: 4px; }
    .pulsanti { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      flex: 1 1 180px;
      min-height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--verde);
      color: #fff;
      font-family: inherit;
    }
    button.secondario { background: #2b3a2e; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .errore { color: #c0172f; font-weight: 700; min-height: 1.2em; margin: 0; }
    .anteprima {
      margin-top: 20px;
      text-align: center;
    }
    .anteprima canvas {
      width: 100%;
      max-width: 360px;
      height: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
    }
    .indirizzo-mostrato { word-break: break-all; font-family: monospace; color: #3d5a40; }

    /* Quando si stampa, si vede solo il QR code */
    @media print {
      body { background: #fff; }
      .scheda, h1, p.intro, .non-stampare { display: none !important; }
      .anteprima canvas { max-width: 12cm; border: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>📱 Generatore QR code</h1>
    <p class="intro">
      Incolla qui sotto l'indirizzo del sito già pubblicato (es. quello che ti dà Netlify),
      premi <strong>Genera</strong>, poi <strong>Scarica PNG</strong> per stamparlo.
    </p>

    <div class="scheda">
      <div>
        <label for="url">Indirizzo del sito</label>
        <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
               placeholder="https://nome-del-sito.netlify.app">
        <div class="suggerimento">Deve iniziare con https:// — copialo dalla barra degli indirizzi del browser.</div>
      </div>

      <div>
        <label for="didascalia">Scritta sotto il QR (facoltativa)</label>
        <input id="didascalia" type="text" maxlength="40" value="Inquadrami e gioca!">
      </div>

      <div>
        <label for="dimensione">Qualità dell'immagine</label>
        <select id="dimensione">
          <option value="600">Normale (600 px)</option>
          <option value="1200" selected>Alta, per la stampa (1200 px)</option>
          <option value="2400">Altissima, per poster (2400 px)</option>
        </select>
      </div>

      <p id="errore" class="errore" role="alert"></p>

      <div class="pulsanti">
        <button id="genera" type="button">Genera QR code</button>
        <button id="scarica" type="button" class="secondario" disabled>⬇ Scarica PNG</button>
        <button id="stampa" type="button" class="secondario" disabled>🖨 Stampa</button>
      </div>
    </div>

    <div class="anteprima">
      <canvas id="tela" width="10" height="10" aria-label="Anteprima del QR code"></canvas>
      <p class="indirizzo-mostrato non-stampare" id="mostrato"></p>
    </div>
  </main>

  <script src="qrcode.js"></script>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const tela = $("tela");

    // Se la pagina è già online, proponiamo in automatico l'indirizzo del sito
    if (location.protocol.startsWith("http")) {
      $("url").value = location.href.replace(/qr\.html.*$/, "");
    }
    tela.style.display = "none";

    function genera() {
      const url = $("url").value.trim();
      $("errore").textContent = "";

      if (!url) {
        $("errore").textContent = "Scrivi prima l'indirizzo del sito.";
        return;
      }
      if (!/^https?:\/\/\S+\.\S+/i.test(url)) {
        $("errore").textContent = "L'indirizzo non sembra valido: deve iniziare con https:// (es. https://mio-sito.netlify.app)";
        return;
      }

      // Livello "Q": il QR si legge anche se un po' rovinato o stampato male
      const qr = QRGeneratore.genera(url, "Q");
      QRGeneratore.disegnaSuCanvas(tela, qr, {
        lato: Number($("dimensione").value),
        didascalia: $("didascalia").value.trim(),
      });
      tela.style.display = "";
      $("mostrato").textContent = "Il QR porta a: " + url;
      $("scarica").disabled = false;
      $("stampa").disabled = false;
    }

    function scarica() {
      const link = document.createElement("a");
      link.download = "qr-code-sito.png";
      link.href = tela.toDataURL("image/png");
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    $("genera").addEventListener("click", genera);
    $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") genera(); });
    $("scarica").addEventListener("click", scarica);
    $("stampa").addEventListener("click", () => window.print());
  </script>
</body>
</html>
